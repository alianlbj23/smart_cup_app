name: Desktop Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: stut_food_intake_project

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        run: flutter build ${{ matrix.platform }} --release

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          tar -czf smart_cup_app-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath smart_cup_app-windows-x64.zip

      - name: Package (macOS)
        if: matrix.platform == 'macos'
        run: |
          ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/${APP_NAME}.app" smart_cup_app-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: smart_cup_app-${{ matrix.platform }}
          path: smart_cup_app-*.*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

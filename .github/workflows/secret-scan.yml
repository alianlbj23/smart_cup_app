name: Secret Scan

# 每次 push 與 PR 都檢查有沒有敏感資料（私鑰、密碼、token、憑證檔）進到 repo。
# 本機的 git hook（.githooks/）可以被 --no-verify 跳過，這裡是最後一道。

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整歷史：被刪掉的檔案仍留在舊 commit 裡。
          fetch-depth: 0
          persist-credentials: false

      - name: Test the scanner
        run: bash tool/check_secrets_test.sh

      - name: Scan tracked files
        run: bash tool/check_secrets.sh --tracked

      - name: Scan commit history
        run: bash tool/check_secrets.sh --commits HEAD
